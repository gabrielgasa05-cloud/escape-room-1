<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sangre en la Hacienda Montoya</title>
<style>
:root{color-scheme:dark;--bg:#0d0d10;--card:#17171c;--tx:#e8e4dc;--mu:#8d8a85;--rd:#c0392b;--ln:#2a2a31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,serif}
.w{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 26px Georgia,serif;letter-spacing:.04em;color:var(--rd);margin:8px 0}
h2{font:600 13px ui-monospace,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--mu);margin:26px 0 8px}
.c{background:var(--card);border:1px solid var(--ln);border-left:3px solid var(--rd);border-radius:6px;padding:12px 14px;margin:10px 0}
.c b{display:block;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--rd);margin-bottom:4px}
.c.n{box-shadow:0 0 0 1px var(--rd)}
.m{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#d8cfa8}
button,input{font:inherit;border-radius:6px;border:1px solid var(--ln);padding:10px 14px}
input{background:#0a0a0c;color:var(--tx);width:100%;margin:8px 0}
button{background:var(--rd);color:#fff;border:0;cursor:pointer;font-weight:700}
button.g{background:transparent;color:var(--mu);border:1px solid var(--ln);font-weight:400;margin-left:8px}
.e{color:#e67e6f;min-height:1.4em;font-size:14px}.ok{border-left-color:#d4af37;background:#201c10}
.r{display:flex;gap:10px;flex-wrap:wrap}.r button{flex:1;padding:16px}
</style></head><body><div class="w" id="app"></div>
<script>
const N=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const INTRO='Hacienda Montoya, noche del cumpleaños 70 de Aurelio Montoya, magnate del café y de otros negocios que nadie nombra. A las 11:47 pm lo hallaron en su estudio, cerrado por dentro, con la cara morada y una sonrisa que nadie entiende. Cinco sospechosos, todos le debían algo: <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Elvira</b> (la esposa), <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Camila</b> (la hija), <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Tomás Vargas</b> (el abogado), el <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Dr. Samuel Rueda</b> (médico de cabecera) y <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Mauricio</b> (el mayordomo, 30 años en la casa). Cuarenta invitados y un solo asesino. Cada uno de ustedes ve cosas que el otro no. Hablen, crucen datos y no confíen en nadie.';
const S=[
{s:1,a:['2220'],q:'Abre la caja fuerte: ingresa el código de 4 dígitos.',c:'CUERVO',h:'La fiesta era de noche, y piensa en formato 24 h. Ojo: lo de “20 minutos adelantado” es un anzuelo para este código.'},
{s:2,a:['tomas','vargas'],q:'¿Quién mintió sobre dónde estaba a las 10 de la noche? (nombre)',c:'ESPINA',h:'Compara cada declaración con las cámaras. Solo una no cuadra.'},
{s:1,a:['piano'],q:'¿Dónde escondieron el veneno? (una palabra)',c:'LAZARO',h:'Para descifrar, mueve cada letra 4 posiciones hacia atrás: I→E.'},
{s:2,a:['elvira'],q:'Acusa al asesino. (nombre)',c:'JUSTICIA',h:'Calcula a qué hora ingirió el veneno y quién estaba en la casa a esa hora.'}];
const C={1:[
[{t:'La escena',b:'El estudio estaba cerrado con llave por dentro. Sobre el escritorio, un vaso de whisky a medias. Tras un cuadro, una caja fuerte con cerradura de 4 dígitos.'},
 {t:'Nota del comisario',b:'Don Aurelio guardaba en la caja “lo que iba a matar a más de uno”. El código es la hora en que se detuvo el reloj de pared del estudio, en formato 24 h y sin dos puntos.'}],
[{t:'Codicilo (de la caja fuerte)',b:'Fechado ayer. Aurelio le deja TODO a Camila y a su fundación. Elvira: ni una teja. Testigo: T. Vargas. Al margen, de puño y letra: “Esta noche se lo digo a todos… y a ella primero.”'},
 {t:'Declaraciones de los sospechosos',b:'<span class=m>ELVIRA: “Estuve en el salón con los invitados toda la noche.”<br>CAMILA: “A las 10 estaba en el jardín, fumando.”<br>TOMÁS: “A las 10 hablaba por teléfono en la terraza.”<br>SAMUEL: “A las 10 estaba en el baño del segundo piso, me sentía mal.”<br>MAURICIO: “A las 10 servía el brindis en el salón.”</span>'}],
[{t:'Teléfono de Tomás',b:'Mensaje cifrado, nunca enviado:<br><span class=m>IP ZIRIRS IWXE IR IP TMERS</span><br>Tomás siempre cifra moviendo cada letra hacia adelante tantas posiciones como el día de su cumpleaños.'},
 {t:'Chisme de pasillo',b:'Camila le debía 80 millones a un prestamista y su padre se negó a pagarlos. Motivo de oro… ¿o señuelo?'}],
[{t:'Frasco hallado',b:'Digoxina 0,25 mg. Paciente: <u>Elvira Montoya</u>. Prescribe: Dr. S. Rueda. Casi vacío.'},
 {t:'Libro de llegadas',b:'<span class=m>Invitados: desde las 21:00.<br>Samuel Rueda: 21:00<br>Tomás Vargas: 21:15<br>Camila: 21:30 (venía de recoger la torta; tiquete de pastelería 20:10)<br>Antes de las 21:00 en la casa: solo Elvira, Mauricio y Aurelio.</span>'}]],
2:[
[{t:'El cuerpo',b:'Muerto en el sillón, mano apretada al pecho. Pupilas dilatadas, labios azulados. El forense llegará más tarde.'},
 {t:'El reloj de pared',b:'Roto y detenido: aguja corta en el 10, aguja larga en el 4. El mayordomo jura que “siempre iba 20 minutos adelantado”. El cuerpo se halló pasadas las 11 de la noche.'}],
[{t:'Informe forense',b:'Envenenamiento por digoxina en el whisky. El paro llega unas 2 horas después de ingerirla. Hora real de muerte: 22:00 (no la del reloj).'},
 {t:'Cámaras (hora real)',b:'<span class=m>SALÓN 21:50–22:15: Elvira en el brindis, Mauricio sirviendo.<br>JARDÍN 21:55–22:10: Camila fumando.<br>BAÑO 2º PISO 21:40–22:05: entra Samuel, sale a las 22:05.<br>TERRAZA 21:30–22:30: vacía. Registro telefónico de Tomás: su única llamada terminó a las 21:45.</span>'}],
[{t:'Ficha de Tomás Vargas',b:'Nacido el 04/03/1981. Abogado de Aurelio hace 12 años. Meses cobrándole de más a la familia.'},
 {t:'Samuel Rueda',b:'Deudas de juego. Lo vieron discutiendo en voz baja con una mujer de la familia en el pasillo, horas antes de la fiesta.'}],
[{t:'Bitácora de Mauricio',b:'<span class=m>18:00 llené el decantador con una botella nueva y sellada.<br>20:00 la señora me quitó la bandeja y llevó ella misma el vaso con hielo al estudio. Quedaron solos cinco minutos.<br>20:05 salí a recibir al florista.<br>De medicinas no sé nada.</span>'}]]};
const EPI='<b>CASO CERRADO.</b> Elvira se enteró de que Aurelio la dejaba sin nada y que esa noche lo anunciaría. A las 8 en punto le llevó “el whisky de cortesía” con la digoxina de sus propias pastillas, se aseguró de estar rodeada de gente cuando él cayera y adelantó el reloj del estudio 20 minutos para enredar la hora. Tomás, que firmó el codicilo, encontró el frasco escondido en el piano y la chantajeaba… por eso mintió: estaba en el estudio buscando una copia, con el muerto ya frío. Samuel jamás pisó la casa antes de las 21:00, y solo recetó. Aurelio quería cambiar su testamento; Elvira, de 63 años, cambió el final de la historia.';
let me=0,u=1,msg='',done=false,err='',hint=false;
const $=document.getElementById('app');
function pick(p){me=p;draw()}
function send(){const v=document.getElementById('v').value,k=u-1;err='';hint=false;
 if(S[k].s===me){if(S[k].a.some(x=>N(v).includes(x))){msg=S[k].c;if(k===3)done=true;else u=k+2}else err='Eso no cuadra. Revisen de nuevo… con su pareja.'}
 else{if(N(v)===N(S[k].c)){msg='';u=k+2;if(k===3)done=true}else err='Contraseña incorrecta.'}
 draw()}
function draw(){
 if(!me){$.innerHTML='<h1>SANGRE EN LA HACIENDA MONTOYA</h1><p>Escape room de asesinato para dos. Cada uno abre esta página en su dispositivo y elige un rol distinto. Hablen por llamada: nadie tiene todas las pistas.</p><div class=r><button onclick="pick(1)">Soy el Detective ROJO</button><button onclick="pick(2)" style="background:#2f5fa8">Soy el Detective AZUL</button></div>';return}
 let h='<h1>SANGRE EN LA HACIENDA MONTOYA</h1><div class=c><b>El caso · '+(me==1?'Detective ROJO':'Detective AZUL')+'</b>'+INTRO+'</div><h2>Tu expediente</h2>';
 for(let i=0;i<u;i++)C[me][i].forEach(x=>{h+='<div class="c'+(i==u-1?' n':'')+'"><b>'+x.t+'</b>'+x.b+'</div>'});
 if(msg)h+='<div class="c ok"><b>Díganle a su pareja</b>Su contraseña para seguir: <span class=m style="font-size:20px">'+msg+'</span></div>';
 if(done)h+='<div class="c ok">'+EPI+'</div>'+(me==2?'':'');
 else{const k=u-1,sv=S[k].s===me;
  h+='<h2>'+(sv?'Tu misión':'Esperando a tu pareja')+'</h2><div class=c><b>'+(sv?'Desbloqueo '+(k+1)+' de 4':'Ingresa su contraseña')+'</b>'+(sv?S[k].q:'Tu pareja debe resolver el siguiente enigma con tus datos. Cuando lo logre, les dará una contraseña. Escríbela aquí.')+'<input id=v autocomplete=off placeholder="'+(sv?'Tu respuesta':'Contraseña')+'"><button onclick="send()">Probar</button>'+(sv?'<button class=g onclick="hint=!hint;draw()">Pista</button>':'')+'<div class=e>'+err+(hint?'<br>💡 '+S[k].h:'')+'</div></div>'}
 $.innerHTML=h;const i=document.getElementById('v');if(i)i.addEventListener('keydown',e=>{if(e.key=='Enter')send()})}
document.head.insertAdjacentHTML('beforeend','<style>.c.u{border-left-style:dashed;border-left-color:#b8860b;background:#1d1b14}.c.u b{color:#d4a72c}.hp{font-size:20px;letter-spacing:2px;margin:6px 0}</style>');
C[2][0].push({t:'Policía de turno',u:1,b:'“Aurelio usaba claves de 12 horas, como los relojes de abuelo.”'});
C[1][1].push({t:'Testigo anónimo',u:1,b:'“Vi a Camila salir del estudio a las 10 en punto, pálida.”'});
C[2][1].push({t:'Valet parking',u:1,b:'“Vi a Mauricio cruzando el patio, solo, a las 10 de la noche.”'});
C[1][2].push({t:'Papel arrugado en la basura',u:1,b:'<span class=m>MX OSYJQ HQ GXNXQ</span><br>Sin firma ni regla.'});
C[2][2].push({t:'Declaración de Samuel',u:1,b:'“Yo vi a Tomás enterrar algo en el jardín.”'});
C[1][3].push({t:'Camila habla',u:1,b:'“Mi mamá dice que Samuel le dio pastillas de más.”'});
C[2][3].push({t:'Samuel jura',u:1,b:'“Elvira dejó la digoxina hace meses. Ese frasco no es de ahora.”'});
S.forEach(x=>x.f=x.f||[{l:'Tu respuesta',a:x.a}]);
S[3].f=[{l:'¿Quién es el culpable?',a:['elvira']},{l:'¿Qué sustancia usó?',a:['digoxina','digital']},{l:'¿A qué hora envenenó el whisky?',a:['2000','8pm','ocho']}];
S[3].q='Acusación formal. Si una sola respuesta falla, el fiscal la rechaza.';
let L=5,over=false;
function lose(m){L--;err=m+' (−1 vida)';if(L<=0)over=true}
function tip(){if(!hint){L--;if(L<=0)over=true}hint=true;draw()}
function reset(){L=5;over=false;u=1;msg='';done=false;err='';hint=false;draw()}
function send(){const k=u-1;err='';
 if(S[k].s===me){const ok=S[k].f.every((f,i)=>f.a.some(x=>N(document.getElementById('v'+i).value).includes(x)));
  if(ok){msg=S[k].c;hint=false;if(k===3)done=true;else u=k+2}
  else lose(k===3?'Al menos una de las tres está mal. Acusar mal libera al culpable.':'Eso no cuadra.')}
 else{if(N(document.getElementById('v0').value)===N(S[k].c)){msg='';hint=false;u=k+2;if(k===3)done=true}else lose('Contraseña incorrecta.')}
 draw()}
function draw(){
 if(!me){$.innerHTML='<h1>SANGRE EN LA HACIENDA MONTOYA</h1><p>Escape room de asesinato para dos, versión sin piedad. Cada uno abre esta página en su dispositivo y elige un rol distinto. Hablen por llamada.</p><div class=c><b>Reglas</b>5 vidas cada uno. Cada error, contraseña mala o pista usada cuesta 1 vida. Si llegan a 0, caso archivado. Ojo: algunas pistas están <u>SIN VERIFICAR</u> y pueden ser falsas. Otras parecen útiles y no lo son. No todo lo que les dicen es verdad.</div><div class=r><button onclick="pick(1)">Soy el Detective ROJO</button><button onclick="pick(2)" style="background:#2f5fa8">Soy el Detective AZUL</button></div>';return}
 if(over){$.innerHTML='<h1>CASO ARCHIVADO</h1><div class=c>Se les acabó la credibilidad y el comisario les quitó el caso. Un asesino sigue suelto y brindando.</div><button onclick="reset()">Reabrir el caso (reinicia tu expediente; tu pareja debe hacer lo mismo)</button>';return}
 let h='<h1>SANGRE EN LA HACIENDA MONTOYA</h1><div class=hp>'+'❤️'.repeat(L)+'🖤'.repeat(5-L)+'</div><div class=c><b>El caso · '+(me==1?'Detective ROJO':'Detective AZUL')+'</b>'+INTRO+'</div><h2>Tu expediente</h2>';
 for(let i=0;i<u;i++)C[me][i].forEach(x=>{h+='<div class="c'+(x.u?' u':'')+(i==u-1?' n':'')+'"><b>'+(x.u?'⚠ SIN VERIFICAR · ':'')+x.t+'</b>'+x.b+'</div>'});
 if(msg)h+='<div class="c ok"><b>Díganle a su pareja</b>Su contraseña para seguir: <span class=m style="font-size:20px">'+msg+'</span></div>';
 if(done)h+='<div class="c ok">'+EPI+'<br><br><b>Credibilidad final:</b> '+'❤️'.repeat(L)+'🖤'.repeat(5-L)+'</div>';
 else{const k=u-1,sv=S[k].s===me;
  h+='<h2>'+(sv?'Tu misión':'Esperando a tu pareja')+'</h2><div class=c><b>'+(sv?'Desbloqueo '+(k+1)+' de 4':'Ingresa su contraseña')+'</b>'+(sv?S[k].q:'Tu pareja debe resolver el siguiente enigma con tus datos. Cuando lo logre, les dará una contraseña. Escríbela aquí.');
  (sv?S[k].f:[{l:'Contraseña'}]).forEach((f,i)=>{h+='<input id=v'+i+' autocomplete=off placeholder="'+f.l+'">'});
  h+='<button onclick="send()">Probar</button>'+(sv?'<button class=g onclick="tip()">Pista (−1 vida)</button>':'')+'<div class=e>'+err+(hint?'<br>💡 '+S[k].h:'')+'</div></div>'}
 $.innerHTML=h;document.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key=='Enter')send()}))}
draw();
</script></body></html>
